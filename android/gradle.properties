org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# Flutter 3.47 ve AGP 9 ile yerleşik Kotlin derlemesini etkinleştir.
android.builtInKotlin=true
# Flutter Gradle eklentisi yeni AGP DSL'e tamamen geçene kadar eski DSL
# uygulamasını sağlayan resmi AGP 9 uyumluluk katmanını kullan.
android.newDsl=false
